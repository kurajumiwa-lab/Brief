# CI + deploy for the Brief_ vendor network (Directive v2.1 §7).
#
# Install: copy this file to .github/workflows/deploy.yml and commit from an
# account with the `workflows` permission (the Arena GitHub App that opened
# this PR is not allowed to write under .github/workflows).
#
#   mkdir -p .github/workflows && cp deploy/github-deploy.yml .github/workflows/deploy.yml
#
#   push / PR → main   : backend tests (Postgres service, migrations applied and
#                        checked), a load-test smoke run against a live API,
#                        frontend tests + build
#   push → main        : build & push both images to GHCR, then SSH to the host and
#                        `docker compose -f docker-compose.prod.yml up -d` (migrations run in the entrypoint)
#
# Deploy needs these repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
# DEPLOY_PATH (checkout on the host containing .env). Skipped when they are absent.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brief
          POSTGRES_PASSWORD: brief
          POSTGRES_DB: brief_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brief -d brief_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://brief:brief@localhost:5432/brief_test
      DATABASE_URL: postgresql+asyncpg://brief:brief@localhost:5432/brief_test
      REDIS_URL: ""
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests
        working-directory: backend
        run: pytest -q

  loadtest-smoke:
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brief
          POSTGRES_PASSWORD: brief
          POSTGRES_DB: brief_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brief -d brief_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://brief:brief@localhost:5432/brief_test
      REDIS_URL: ""
      SECRET_KEY: ci-only-secret
      AUTO_CREATE_TABLES: "false"
      RUN_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Start the API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/brief-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
      - name: Load smoke (harness + SLO gate)
        run: python loadtest/brief_load.py --smoke --requests 40 --json loadtest-smoke.json
      - name: Upload the load summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-smoke
          path: loadtest-smoke.json
          if-no-files-found: ignore
      - name: API log on failure
        if: failure()
        run: tail -100 /tmp/brief-api.log

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npm run build

  build-images:
    if: github.event_name != 'pull_request'
    needs: [backend-tests, loadtest-smoke, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEPLOY_HOST / DEPLOY_SSH_KEY not set — images pushed, host deploy skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Roll out on the host
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git checkout -f "${{ github.sha }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export IMAGE_BACKEND="${{ env.IMAGE_BACKEND }}:${{ github.sha }}"
            export IMAGE_FRONTEND="${{ env.IMAGE_FRONTEND }}:${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull backend worker frontend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend curl -fsS http://localhost:8000/api/health >/dev/null; then
                echo "healthy"; exit 0
              fi
              sleep 5
            done
            echo "backend never became healthy" >&2
            docker compose -f docker-compose.prod.yml logs --tail=100 backend
            exit 1
