name: CI

# WHY THIS WORKFLOW EXISTS
#
# Quality checks must not depend on a person remembering a command. Every push
# and every pull request to main runs the frontend tests and production build,
# the backend compile check and suite against real PostgreSQL, and the three
# migration checks. The workflow is CI-only: it has no deploy secrets, no
# package publish, no production environment and no SSH.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege. The install token needs `contents: write` plus `workflows`
# permission to push this file; the RUN token only needs to read the checkout.
# No `packages: write`, `id-token: write`, deploy secrets or environments.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Full history lets lint:changed diff against origin/main on a PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` on the lockfile: the build must be reproducible from what is
      # committed, not from whatever `npm install` resolves today.
      - name: Install
        run: npm ci --no-audit --no-fund

      # New and changed frontend files are gated. ESLint still reports the
      # repository's pre-existing errors below, but they cannot hide a new one.
      - name: Lint changed files
        run: npm run lint:changed origin/main

      - name: Lint all (report only)
        run: npx eslint src --max-warnings 0
        continue-on-error: true # 26 pre-existing errors; see docs/ci/README.md

      - name: Tests
        run: npx vitest run --reporter=verbose

      # Catches unresolved imports, a page that no longer builds, and — via
      # the route/contrast invariant tests — dead links and palette drift.
      - name: Production build
        run: npx vite build

      - name: Bundle size report
        run: |
          echo "### Main bundle" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist/assets/*.js | awk '{printf "- %d kB  %s\n", $5/1024, $9}' \
            | sort -t' ' -k2 -rn | head -5 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  backend:
    name: Backend — compile and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # Cheapest possible signal: a module that does not import is a broken
      # deployment. Runs before the suite so the failure is unambiguous.
      - name: Compile check
        run: python -m compileall -q app

      # The tests need a real PostgreSQL — they take advisory locks and call
      # `to_regclass`, neither of which SQLite supports. `pgserver` bundles
      # PostgreSQL so this works on a bare runner with no service container.
      - name: Tests
        run: python -m pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@/test?host=/tmp
          SECRET_KEY: ci-not-a-real-secret

  migrations:
    name: Migrations — single head and drill
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements-dev.txt

      # Alembic refuses to run with more than one head: that is a failed merge
      # waiting to happen, and it is the one migration defect detectable without
      # a database.
      - name: Exactly one head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = script.get_heads()
          print(f"heads: {heads}")
          if len(heads) != 1:
              raise SystemExit(f"expected one migration head, found {len(heads)}: {heads}")
          revs = len(list(script.walk_revisions()))
          print(f"{revs} revisions, head {heads[0]}")
          PY
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@/unused
          SECRET_KEY: ci-not-a-real-secret

      # Drill first (proves the chain applies over live-shaped data), then
      # parity (proves the result matches the models).
      - name: Migrations apply over existing data
        run: python scripts/migration_drill.py
        env:
          SECRET_KEY: ci-not-a-real-secret

      - name: Schema parity with the models
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile
          import pgserver

          with tempfile.TemporaryDirectory() as tmp:
              uri = pgserver.get_server(tmp).get_uri()
              env = {**os.environ,
                     "DATABASE_URL": uri.replace("postgresql://", "postgresql+asyncpg://"),
                     "SECRET_KEY": "ci-not-a-real-secret"}
              up = subprocess.run([sys.executable, "-m", "alembic", "upgrade", "head"], env=env)
              if up.returncode:
                  raise SystemExit("alembic upgrade head failed")
              rc = subprocess.run([sys.executable, "scripts/schema_parity.py"], env=env).returncode
              raise SystemExit(rc)
          PY
        env:
          SECRET_KEY: ci-not-a-real-secret
