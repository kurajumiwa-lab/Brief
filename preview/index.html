<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#F7F8FA" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- First paint matches the app and React loader: one Wairo identity,
         never a black interstitial or an earlier Brief splash. -->
    <style>
      html, body, #root { background: #F7F8FA !important; color: #0A0E14; margin: 0; }
      #boot-splash { position:fixed; inset:0; z-index:9999; background:#F7F8FA; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px; font-family:Inter,system-ui,sans-serif; }
      #boot-splash .inner { display:flex; flex-direction:column; align-items:center; gap:10px; }
      #boot-splash .word { color:#0A0E14; font-weight:800; font-size:32px; letter-spacing:-.06em; line-height:1; }
      #boot-splash .avenue { color:#52646a; font-weight:650; font-size:11px; text-transform:uppercase; letter-spacing:.23em; }
      #boot-splash p { font-size:12px; color:#5a6472; margin:0; }
      #boot-recovery { text-align:center; padding:20px; font-size:13px; }
      #boot-recovery a { display:inline-block; margin:12px; color:#2d6a4f; }
    </style>
    <title>Wairo Blue Avenue</title>
    <meta name="description" content="Your space. Your people. Your next plan. Discover shops, work, community, parties and trips on Wairo Blue Avenue." />
    <!-- The offline shell: installable, and it paints from cache when the
         signal dies. Writes survive via the offline queue (idempotent,
         server-deduped) — the API itself is never cached. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Telegram WebApp SDK: REMOVED 2026-09-19 with the Telegram rail retired.
         It was not a no-op: an unpaced third-party script in <head> is a DNS +
         TLS + fetch in front of first paint, on every load, for people on metered
         data — and nothing in the production entry read what it provided. The
         live shell (main.jsx -> AppShell) touches no Telegram global; the only
         readers were shell/hooks/useSessionBoot.ts (not mounted) and App.tsx
         (harness-only), and briefApi.isTelegramMiniApp() already returns false
         whenever window.Telegram is absent, so the Mini App sign-in path simply
         stops running. To bring Telegram back: restore this tag AND set the bot
         credentials, since /api/telegram/init answers closed without them. -->
    <link rel="icon" type="image/svg+xml" href="/wairo-mark.svg" />
    <link rel="apple-touch-icon" href="/wairo-icon-192.png" />
    <!-- Design system type (§3): Fraunces + IBM Plex, loaded NON-BLOCKING so a
         slow or blocked Google Fonts request can never blank the first paint.
         The page renders instantly on the system-font fallback and upgrades to
         the brand faces the moment they arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Opening Wairo Blue Avenue">
      <div class="inner">
        <svg width="54" height="54" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <defs><linearGradient id="boot-g" x1="6" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2563EB" /><stop offset="1" stop-color="#10B981" /></linearGradient></defs>
          <g stroke="url(#boot-g)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="7" width="22" height="22" rx="7" /><rect x="19" y="7" width="22" height="22" rx="7" /><rect x="7" y="19" width="22" height="22" rx="7" /><rect x="19" y="19" width="22" height="22" rx="7" />
          </g>
        </svg>
        <div class="word">Wairo</div><div class="avenue">Blue Avenue</div>
      </div>
      <p>Opening your avenue…</p>
      <div id="boot-recovery" hidden><p>Taking longer than expected. Check your connection.</p><a href="" onclick="window.location.reload(); return false">Try again</a></div>
      <noscript><p>Enable JavaScript to open Wairo Blue Avenue.</p></noscript>
    </div>
    <script>
      // Still useful if the main bundle fails to download or execute.
      window.setTimeout(function () { var el = document.getElementById('boot-recovery'); if (el) el.hidden = false; }, 12000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <script>
      // Feature-detected and fail-silent: no service worker support (or an
      // insecure context) simply means no offline shell — the app still works.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
</body>
</html>
