<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b100e" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Vendor World — the digital connection layer for everyday trade. Find suppliers, skilled trades, equipment and enterprises, and give your own business a vendor front, verified identity and a record of every trade."
    />
    <meta property="og:title" content="Vendor World — the digital connection layer for everyday trade" />
    <meta
      property="og:description"
      content="An existing economy, connected. Discover the businesses around you, publish your own capabilities, and keep a record of every relationship you build."
    />
    <meta property="og:type" content="website" />
    <title>Vendor World — the digital connection layer for everyday trade</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Theme bootstrap. Runs before paint so a returning user never sees a flash
      of the wrong theme. Stored preference wins; otherwise follow the OS.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("brief-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Two families, not four. The seven-segment and Orbitron faces were dropped
      in v3: they cost two extra requests and hurt legibility below 24px.
      `font-display: swap` means the system stack paints first either way.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="bg-surface-0 text-ink-2 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
