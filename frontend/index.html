<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101216" />
    <meta name="description" content="My Shop App — the trade information network for people who run shops. Prices, suppliers, stock, rentals, groups and what is changing in your market." />
    <title>My Shop App</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <!-- Non-blocking: the system font stack renders first, webfonts swap in when they arrive. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Seven-segment face for digital readouts (timer look); Orbitron is the fallback. -->
    <link
      href="https://fonts.cdnfonts.com/css/dseg7-classic"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body class="bg-surface-0 text-ink-1 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
