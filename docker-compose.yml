# Brief_ vendor network — full stack.
#   docker compose up --build
#   frontend  http://localhost:3000     (nginx → SPA, proxies /api to backend)
#   backend   http://localhost:8000     (FastAPI, /docs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brief
      POSTGRES_PASSWORD: brief
      POSTGRES_DB: brief_vendors
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brief -d brief_vendors"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    # Values below are interpolated from ./.env when present (see .env.example).
    environment:
      DATABASE_URL: postgresql+asyncpg://brief:brief@db:5432/brief_vendors
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "false"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      POS_SYNC_INTERVAL: ${POS_SYNC_INTERVAL:-300}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
